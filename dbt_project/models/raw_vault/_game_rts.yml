version: 2

models:
  - name: game_rts
    description: "Record tracking satellite of the game hub. One row every time a game appears in a run."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - hk_game_h
              - ldts
    columns:
      - name: hk_game_h
        description: "Hash key of the tracked game (game_h)."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('game_h')
                field: hk_game_h
      - name: rsrc
        description: "Record source (cheapshark_deals_api)."
        data_tests:
          - not_null
      - name: ldts
        description: "Load date of the run in which the game appeared."
        data_tests:
          - not_null